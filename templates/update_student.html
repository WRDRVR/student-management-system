<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>Student table</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>

    <body>
        <header>
          <div class="headerElements">
             <button class="sidebarBtn" id="sidebarBtn">≡</button>
             <div class="logo">S M S</div>
         </div>
        </header>

        <div class="sidebar-overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">S M S</div>
      <button class="close-btn" id="closeBtn">×</button>
    </div>
    <nav class="sidebar-menu">
      <a href="/" class="menu-item">Home</a>
      <a href="/add_student" class="menu-item">Add student</a>
      <a href="/view_students"  class="menu-item">All students</a>
      <a href="/search_student" class="menu-item">Search</a>
    </nav>
  </aside>
      <main>
        
        <form id="updateForm">

          <h1>Update Student</h1>
          <p id="updateMessage"></p>

          <div class="form-group">
                <label><strong>Student ID:</strong> {{ student[0] }}</label>
                <input id="studentID" type="hidden" value="{{ student[0] }}">
          </div>

            <div class="main-form">

              <div class="form-group">
                <label>Name</label>
                <input id="name" required type="text" name="name" value="{{ student[1] }}">
              </div>

              <div class="form-group">
                <label>Age</label>
                <input id="age" required type="int" name="age" value="{{ student[2] }}">
              </div>

              <div class="form-group">
                <label>Grade</label>
                <select name="grade" value="{{ student[3] }}">
                  <option value="{{ student[3] }}">{{ student[3] }}</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                </select>
              </div>
            
              <div class="form-group">
                <label>Course</label>
                <select name="course" value="{{ student[4] }}">
                  <option value="{{ student[4] }}">{{ student[4] }}</option>
                  <option value="General Science">General Science</option>
                  <option value="General Arts">General Arts</option>
                  <option value="Business">Business</option>
                  <option value="Visual Arts">Visual Arts</option>
                  <option value="Agric">Agric Studies</option>
                </select>
              </div>

              <div class="form-group">
                <label>Phone</label>
                <input id="phone" name="phone" value="{{ student[5] }}">
              </div>

              <div class="form-group">
                <label>Email</label>
                <input id="email" name="email" value="{{ student[6] }}">
              </div>

            </div>

            <button class="update-student" type="submit">Save Changes</button>

        </form>
      </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
