<!DOCTYPE html>
<html lang="eng">
<head>
    <title>User Profile</title>
    <meta charset="UTF-8">
</head>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<body>
  <header>
    <div class="headerElements">
      <button class="sidebarBtn" id="sidebarBtn">≡</button>
     <div class="logo">S M S</div>
    </div>
  </header>

    <div class="sidebar-overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">S M S</div>
      <button class="close-btn" id="closeBtn">×</button>
    </div>
    <nav class="sidebar-menu">
      <a href="/students" class="menu-item">Home</a>
      <a href="/students/add_student" class="menu-item">Add student</a>
      <a href="/students/view_students"  class="menu-item">All students</a>
      <a href="/students/search_student" class="menu-item">Search</a>
      <a href="/logout" class="menu-item">Logout</a>
    </nav>
  </aside>

        <h2>Profile</h2>
        <p>User ID  <strong>{{ user[0] }}</strong></p>
      <section class="student-details">
          
        <section class="info-card">
            <p class="section-head">Personal Info</p>
            <span><strong>{{ user[1] }}</strong></span>
            <span>Email:   <strong>{{ user[3] }}</strong></span>
            <span>Phone:   <strong>{{ user[5] }}</strong></span>

            <span>Role:  <strong>{{ user[7] }}</strong></span>
            <button id="changeRole">Change Role</button>
        </section>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
